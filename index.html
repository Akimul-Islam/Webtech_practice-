<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-image: url('bgi.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .formBox {
            background-color: rgba(255, 255, 255, 0.25); /* Semi-transparent white */
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            min-height: 200px; /* Gives it visible height even while empty */
        }

        .fromLabel {
            font-size: 25px;
            color: #504e4e;
            display: inline-block;
            margin-top: 15px;
            margin-bottom: 2px;
        }

        .fromInput {
            width: 100%;
            padding: 10px;
            margin-top: 5px; 
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            padding-bottom: 15px;
            padding-top: 15px;
        }
        h1{
        text-align: center;
        font-size: 45px;
        color: #000000;
        margin-top: 20px;
        padding-bottom: 20px;
        padding-top: 85px;
    }
    </style>
    
</head>
<body>
    <h1>Web Tech course First practice website</h1>
    
    <div class="formBox">
        <form>
            <label for="name" class="fromLabel">Name:</label><br>
            <input type="text" id="name" name="name" class="fromInput" placeholder="Enter your Name"><br>

            <label for="email" class="fromLabel">Email:</label><br>
            <input type="email" id="email" name="email" class="fromInput" placeholder="Enter your Email">

            <label for="age" class="fromLabel">Age:</label><br>
            <input type="number" id="age" name="age" class="fromInput" min="10" max="125" placeholder="Enter your Age"><br>

            <label for="Roles" class="fromLabel">Roles:</label><br> 
                <select name="Roles" id="Roles" class="fromInput">
                    <option value="">Select your Role</option>
                    <option value="Student">Student</option>
                    <option value="Teacher">Teacher</option>
                    <option value="Admin">Admin</option>
                </select>

            <label for="gender" class="fromLabel">Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label><br>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label><br>  

        </form>

    </div>
        
</body>
</html>
