<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <link rel="icon" type="image" href="icon.png">
    
    <style>
        body {
            background-image: url('bgi.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .formBox {
            background-color: rgba(255, 255, 255, 0.25); /* Semi-transparent white */
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            min-height: 200px; /* Gives it visible height even while empty */
        }

        .fromLabel {
            font-size: 25px;
            color: #504e4e;
            display: inline-block;
            margin-top: 15px;
            margin-bottom: 2px;
        }

        .fromInput {
            width: 100%;
            padding: 10px;
            margin-top: 5px; 
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            padding-bottom: 15px;
            padding-top: 15px;
        }
        h1{
        text-align: center;
        font-family: fantasy;
        font-size: 45px;
        color: #000000;
        margin-top: 20px;
        padding-bottom: 20px;
        padding-top: 85px;
        }

        h2{
        text-align: center;
        font-family: monospace;
        font-size: 35px;
        color: #000000;
        margin-top: 20px;
        padding-bottom: 20px;
        padding-top: 85px;

        }
        .commentBox{
            min-height: 60px;
            width: 100%;
            padding: 10px;
            margin-top: 5px; 
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            padding-bottom: 15px;
            padding-top: 15px;
           
        }
        .submitBtn{
            color: azure;
            background-color:rgb(45, 45, 215);
            width: 100%;
            font-size: large;
            padding: 10px;
            margin-top: 35px; 
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            padding-bottom: 15px;
            padding-top: 15px;

        }

        table {
        width: 50%;
        margin: auto;
        border-collapse: collapse;/* Merges double borders into a single clean border */

        margin-bottom: 100px;
        }
        th, td {
        border: 5px solid #333;
        padding: 8px 12px;
        text-align: center;
        }

        caption{
            font-size: 23px;
            text-align: center;
        }

    </style>
    
</head>
<body>
    <h1>Web Tech course practice website</h1>
    <h2>Practicing Making a Form</h2>
    
    <div class="formBox">
        <form>
            <label for="name" class="fromLabel">Name:</label><br>
            <input type="text" id="name" name="name" required class="fromInput" placeholder="Enter your Name"><br>

            <label for="email" class="fromLabel">Email:</label><br>
            <input type="email" id="email" name="email" class="fromInput" required placeholder="Enter your Email">
            <label for="password" class="fromLabel">Enter your password</label><br>
            <input type="password" required id="password" placeholder="Enter your password" class="fromInput">

            <label for="age" class="fromLabel">Age:</label><br>
            <input type="number" id="age" name="age" class="fromInput" min="10" max="125" placeholder="Enter your Age"><br>

            <label for="date" class="fromLabel">What is your Birthday?</label><br>
            <input type="date" id="date" required><br>

            <label for="Roles" class="fromLabel">Roles:</label><br> 
                <select name="Roles" id="Roles" class="fromInput">
                    <option value="">Select your Role</option>
                    <option value="Student">Student</option>
                    <option value="Teacher">Teacher</option>
                    <option value="Admin">Admin</option>
                </select>

            <label for="gender" class="fromLabel">Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male" class="radioBtn" required>
                <label for="male">Male</label><br>
                <input type="radio" id="female" name="gender" value="female" class="radioBtn" required>
                <label for="female">Female</label><br>  

            <label class="fromLabel">what are your skills?</label><br>
            
            <input type="checkbox" id="java" class="checkBox">
            <label for="java">Java</label><br>

            <input type="checkbox" id="python" class="checkBox">
            <label for="python">python</label><br>

            <input type="checkbox" id="C++" class="checkBox">
            <label for="C++">C++</label><br>

            <input type="checkbox" id="Dart" class="checkBox">
            <label for="Dart">Dart</label><br>

            <input type="checkbox" id="C#" class="checkBox">
            <label for="C#">C#</label><br>

            <label for="Suggession" class="fromLabel">Any Comment or Suggession?</label><br>
            <textarea id="Suggession" name="suggestion" class="commentBox" rows="4" placeholder="Write your suggestions here"></textarea><br>

            <label for="picture" class="fromLabel" padding-left="10px"> Upload Your picture</label><br>
            <input type="file" name="file" id="picture">
            <button type="submit" class="submitBtn">Submit</button>
        </form><br>

    </div>


        <h2>Practicing Table Making</h2>

    <div>
        <table>
                <caption>This is just for practice</caption>
            <thead>
                
                <th>Name</th>
                <th>Age</th>
                <th>course</th>

            </thead>
            <tbody>
                <tr>
                    <td>MD. Akimul Islam</td>
                    <td>23</td>
                    <td>web Tech</td>
                </tr>

                 <tr>
                    <td>Jhon</td>
                    <td>29</td>
                    <td>web Tech</td>
                </tr>

                 <tr>
                    <td>Victor</td>
                    <td>25</td>
                    <td>web Tech</td>
                </tr>
            </tbody>
        </table>
    </div>
        
</body>
</html>
